x-postgres-client: &postgres-client
  ConnectionStrings__Postgres: 'Host=postgres;Port=5432;Database="${POSTGRES_DB:?POSTGRES_DB is required}";Username="${POSTGRES_USER:?POSTGRES_USER is required}"'
  PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

x-minio-credentials: &minio-credentials
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

services:
  migrator:
    build:
      context: .
      target: migrator
    environment: *postgres-client
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    build:
      context: ./docker
      dockerfile: Minio.Dockerfile
      target: minio
    command: ["server", "--address", ":9000", "--console-address", ":9001", "/data"]
    environment:
      <<: *minio-credentials
      MINIO_BROWSER: "off"
    volumes:
      - minio_data:/data
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/cluster"]
      interval: 5s
      timeout: 3s
      retries: 20

  bucket-init:
    build:
      context: ./docker
      dockerfile: Minio.Dockerfile
      target: mc
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ! mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 ||
           ! mc mb --ignore-existing "local/$$MINIO_BUCKET" >/dev/null 2>&1 ||
           ! mc stat "local/$$MINIO_BUCKET" >/dev/null 2>&1; then
          echo 'MinIO bucket initialization failed. Check the configured credentials, bucket name and S3 permissions.' >&2
          exit 1
        fi
        echo 'MinIO bucket is ready.'
    environment:
      <<: *minio-credentials
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *postgres-client
      ASPNETCORE_ENVIRONMENT: Development
      AllowedHosts: localhost
      Https__Port: "8443"
      ReverseProxy__KnownProxies__0: "${CADDY_IP:-172.31.243.2}"
      ReverseProxy__ForwardLimit: "1"
      Cors__AllowedOrigins__0: "${CORS_ORIGIN_0:-https://localhost:5173}"
      Cors__AllowedOrigins__1: "${CORS_ORIGIN_1:-https://localhost:3000}"
      Jwt__Issuer: itmo-buddy-local
      Jwt__Audience: itmo-buddy-local-client
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Minio__InternalEndpoint: http://minio:9000
      Minio__ExternalEndpoint: https://localhost:9443
      Minio__AccessKey: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      Minio__BucketName: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    networks:
      - default
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
        restart: true
      minio:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
        restart: true

  caddy:
    image: caddy:2.11.2-alpine
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9443:9443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    tmpfs:
      - /config
    networks:
      edge:
        ipv4_address: "${CADDY_IP:-172.31.243.2}"
    depends_on:
      api:
        condition: service_started

networks:
  edge:
    ipam:
      config:
        - subnet: "${CADDY_SUBNET:-172.31.243.0/28}"
          ip_range: "${CADDY_DYNAMIC_RANGE:-172.31.243.8/29}"

volumes:
  minio_data:
  caddy_data:
